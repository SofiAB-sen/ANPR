name: yolo-detect
channels:
  - http://ssb.stsci.edu/astroconda
  - defaults
dependencies:
  - python=3.10
  - cpuonly
  - pytorch
  - torchvision
  - torchaudio
  - pyyaml
  - pillow
  - tqdm
  - seaborn
  - matplotlib
  - pandas
prefix: /opt/anaconda3/envs/yolo-detect
  - pip:
      - ultralytics==8.3.174
      - psutil
      - py-cpuinfo
      - ultralytics-thop>=2.0.0

